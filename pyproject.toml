[project]
name = "sdlc-mux"
version = "0.1.0"
description = "A tmux-based virtual software team that runs an SDLC pipeline with AI agents."
requires-python = ">=3.12"
dependencies = [
    "typer",
    "pydantic",
    "pyyaml",
    "rich",
]

[project.scripts]
sdlc = "sdlc_mux.cli:app"

[dependency-groups]
dev = [
    "pytest",
    "ruff",
    "mypy",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sdlc_mux"]

[tool.ruff]
line-length = 100

[tool.mypy]
strict = true

[[tool.mypy.overrides]]
module = "yaml"
ignore_missing_imports = true
